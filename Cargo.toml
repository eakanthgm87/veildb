[workspace]
resolver = "2"
members = [
    "crates/storage",
    "crates/crypto",
    "crates/integrity",
    "crates/query",
    "crates/access",
    "crates/sync",
    "crates/core",
    "cli",
    "bindings",
    "relay",
]

[workspace.metadata]
version = "0.1.0"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/veildb/veildb"
rust-version = "1.75"

[workspace.dependencies]
# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Crypto
aes-gcm = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
blake3 = "1"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Async / Sync
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Errors
thiserror = "1"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }
rpassword = "7"

# Testing
proptest = "1"
criterion = "0.5"

# Tauri
tauri = { version = "2", features = ["wry"] }
tauri-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.bench]
debug = true
