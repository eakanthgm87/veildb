[package]
name = "veildb-bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "veildb_bindings"
crate-type = ["rlib"]

[[bin]]
name = "veildb-bindings"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
veildb-core = { path = "../crates/core" }
veildb-sync = { path = "../crates/sync" }
tauri.workspace = true
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# Windows-only: disable WebView2's built-in zoom/pinch so trackpad pinch
# reaches the frontend as ctrl+wheel. Versions match Tauri's (unified by Cargo).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }